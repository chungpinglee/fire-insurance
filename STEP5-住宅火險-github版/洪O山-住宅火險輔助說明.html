                let errorCount = 0; // 錯誤次數計數器

                function b64ToU8(b) {
                    const s = atob(b);
                    const u = new Uint8Array(s.length);
                    for (let i=0; i<s.length; i++) u[i] = s.charCodeAt(i);
                    return u;
                }

                // 嘗試使用輸入密碼拆開特定金鑰槽的包裹，並釋放內容密鑰 (Content Key)
                async function tryUnwrap(slot, pwd) {
                    if (!slot) return null;
                    try {
                        const salt = b64ToU8(slot.salt);
                        const iv = b64ToU8(slot.iv);
                        const ct = b64ToU8(slot.ct);
                        
                        const baseKey = await crypto.subtle.importKey(
                            "raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]
                        );
                        const unwrappingKey = await crypto.subtle.deriveKey(
                            { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
                            baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
                        );
                        const rawKey = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, unwrappingKey, ct);
                        return new Uint8Array(rawKey);
                    } catch(e) {
                        return null; // 此槽以此密碼拆封失敗
                    }
                }

                const pwdInput = document.getElementById('pwd-input');
                const btnUnlock = document.getElementById('btn-unlock');
                const statusTxt = document.getElementById('status-text');
                const vaultContainer = document.getElementById('vault-container');
                const contentViewer = document.getElementById('content-viewer');

                pwdInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleUnlock();
                });

                btnUnlock.addEventListener('click', handleUnlock);

                async function handleUnlock() {
                    if (errorCount >= 3) {
                        showStatus("❌ 嘗試次數過多，輸入框已鎖定關閉。", true);
                        return;
                    }

                    const pwd = pwdInput.value.trim();
                    if (!pwd) {
                        showStatus("請輸入密碼！", true);
                        pwdInput.focus();
                        return;
                    }

                    showStatus("正在驗證防護通行密鑰...", false);
                    btnUnlock.disabled = true;

                    setTimeout(async () => {
                        let contentKey = null;

                        // 依序嘗試拆包：要保人槽 -> 被保險人槽 -> 管理員備用槽 (密碼為 362963)
                        contentKey = await tryUnwrap(w_prop, pwd);
                        if (!contentKey) contentKey = await tryUnwrap(w_insu, pwd);
                        if (!contentKey) contentKey = await tryUnwrap(w_adm, pwd);

                        if (contentKey) {
                            showStatus("🔓 通行驗證成功，正在解密還原文件...", false);
                            
                            try {
                                const contentKeyObj = await crypto.subtle.importKey(
                                    "raw", contentKey, "AES-GCM", false, ["decrypt"]
                                );
                                const pt = await crypto.subtle.decrypt(
                                    { name: "AES-GCM", iv: b64ToU8(iv_content) },
                                    contentKeyObj,
                                    b64ToU8(ct_content)
                                );
                                
                                const decryptedHtml = new TextDecoder().decode(pt);
                                
                                setTimeout(() => {
                                    vaultContainer.style.display = 'none';
                                    contentViewer.style.display = 'block';
                                    
                                    const blob = new Blob([decryptedHtml], { type: 'text/html' });
                                    contentViewer.src = URL.createObjectURL(blob);
                                }, 400);

                            } catch(err) {
                                showStatus("❌ 文件本體還原失敗，請聯繫技術管理員！", true);
                                btnUnlock.disabled = false;
                            }
                        } else {
                            errorCount++;
                            if (errorCount >= 3) {
                                showStatus("❌ 密碼輸入錯誤達 3 次，系統已強制鎖定並關閉輸入框！", true);
                                pwdInput.disabled = true;
                                pwdInput.style.display = 'none'; // 隱藏輸入框
                                btnUnlock.disabled = true;
                                btnUnlock.style.display = 'none'; // 隱藏按鈕
                            } else {
                                showStatus("❌ 密碼驗證無效！剩餘嘗試次數：" + (3 - errorCount) + " 次。", true);
                                btnUnlock.disabled = false;
                            }
                        }
                    }, 100);
                }

                function showStatus(msg, isError) {
                    statusTxt.innerText = msg;
                    statusTxt.style.color = isError ? '#ff3e3e' : '#00ff9d';
                }
