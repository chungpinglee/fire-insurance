<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>南山產物「金頭家」專案投保指南 - 心智圖</title>

<!-- 引入 Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- 引入 D3.js 與 Markmap 核心與 UI 套件 -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/style.css">

<!-- 字型 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">

<!-- 儲存客戶規劃狀態的 JSON 區塊 -->
<script id="app-state-data" type="application/json">{}</script>

<style>
  body { 
    font-family: 'Noto Sans TC', "Microsoft JhengHei", sans-serif; 
    background-color: #f8fafc; 
    overflow: hidden; 
  }

  .scrollbar-hide::-webkit-scrollbar { display: none; }

  /* 節點文字基礎樣式及過渡動畫 */
  .markmap-node foreignObject {
    overflow: visible !important; /* 避免文字放大後被外框裁切 */
  }
  .markmap-node foreignObject > div,
  .markmap-node text {
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s cubic-bezier(0.4, 0, 0.2, 1), fill 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    transform-origin: left center;
    display: inline-block;
  }
  
  /* 互動節點 (含連結或隱藏說明) 基礎樣式：粗體藍色 */
  .interactive-base, #mindmap a {
    color: #1d4ed8 !important; /* Tailwind blue-700 */
    fill: #1d4ed8 !important;
    font-weight: bold !important;
    transition: color 0.2s cubic-bezier(0.4, 0, 0.2, 1), fill 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #mindmap a {
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  /* 未投保時的樣式 (覆蓋原本的粗體與藍色) */
  #mindmap .interactive-base-uninsured,
  #mindmap .interactive-base-uninsured a {
    color: #9ca3af !important; /* Tailwind gray-400 */
    fill: #9ca3af !important;
    font-weight: normal !important;
    text-decoration: line-through !important;
    transition: color 0.2s, fill 0.2s;
  }
  
  /* 懸停時：放大 15% 效果 */
  #mindmap .markmap-node.interactive-hover foreignObject > div,
  #mindmap .markmap-node.interactive-hover text {
    transform: scale(1.15);
    cursor: pointer;
  }
  
  /* 確保懸停時內部重點文字皆變成紅色 */
  #mindmap .markmap-node.interactive-hover foreignObject > div,
  #mindmap .markmap-node.interactive-hover text,
  #mindmap .markmap-node.interactive-hover a,
  #mindmap .markmap-node.interactive-hover .interactive-base {
    color: red !important;
    fill: red !important;
  }

  /* 懸停時，未投保項目的提示色 */
  #mindmap .markmap-node.interactive-hover .interactive-base-uninsured,
  #mindmap .markmap-node.interactive-hover .interactive-base-uninsured a {
    color: #ef4444 !important; /* Tailwind red-500 */
    fill: #ef4444 !important;
    text-decoration: line-through !important;
  }

  /* 專屬列印樣式設定 */
  @media print {
    body { background-color: white !important; }
    /* 隱藏除了費率表面板以外的所有元素 */
    body > *:not(#rate-table-modal) { display: none !important; }
    
    #rate-table-modal {
      position: relative !important;
      display: block !important;
      background: white !important;
    }
    
    #rate-table-modal > div {
      box-shadow: none !important;
      border: none !important;
      max-height: none !important;
      width: 100% !important;
      max-width: 100% !important;
      padding: 0 !important;
    }
    
    /* 隱藏列印與關閉等操作按鈕 */
    .print-hidden { display: none !important; }
    
    /* 強制印出背景顏色(如表頭的灰色與表尾的橘色) */
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }
</style>
</head>
<body class="flex flex-col h-screen w-screen relative">

<!-- 頂部標題列 -->
<div class="w-full bg-white border-b border-gray-200 p-3 flex items-center gap-4 z-[100] shadow-sm">
  <div class="flex items-center gap-2">
    <div class="w-8 h-8 bg-sky-600 rounded-lg flex items-center justify-center text-white font-bold shadow">
      金
    </div>
    <div class="text-lg font-bold text-gray-800" id="main-title">南山產物「金頭家」專案投保指南</div>
  </div>

  <div class="ml-auto flex items-center gap-4">
    <!-- 總保費顯示區塊 (套用後顯示) -->
    <div id="summary-bar" class="hidden items-center gap-3 bg-orange-50 px-4 py-1.5 rounded-lg border border-orange-200 shadow-inner">
        <span class="text-sm font-bold text-orange-800">規劃總保費</span>
        <span class="text-lg font-extrabold text-red-600" id="summary-premium">$0</span>
    </div>
    <button id="config-panel-btn" onclick="openConfigModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow transition-colors flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        投保規劃設定
    </button>
  </div>
</div>

<!-- 控制工具列 -->
<div class="w-full bg-white border-b border-gray-200 p-2 flex flex-wrap items-center gap-4 overflow-x-auto whitespace-nowrap scrollbar-hide shadow-sm z-50 relative">
  <div class="flex items-center gap-2 border-l-4 border-orange-600 pl-2">
    <span class="text-sm font-bold text-gray-500 mr-1">展開層級：</span>
    <button onclick="setExpand(1)" id="exp-1" class="px-4 py-1.5 text-sm font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">1</button>
    <button onclick="setExpand(2)" id="exp-2" class="px-4 py-1.5 text-sm font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">2</button>
    <button onclick="setExpand(3)" id="exp-3" class="px-4 py-1.5 text-sm font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">3</button>
    <button onclick="setExpand(4)" id="exp-4" class="px-4 py-1.5 text-sm font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">4</button>
    <button onclick="setExpand(99)" id="exp-all" class="px-4 py-1.5 text-sm font-bold rounded-lg bg-orange-600 text-white shadow transition-all">全部</button>
  </div>
  <div class="flex items-center gap-2 border-l-4 border-sky-600 pl-2 ml-2">
    <!-- 費率表按鈕 -->
    <button onclick="openRateTableModal()" class="px-4 py-1.5 text-sm font-bold rounded-lg bg-sky-100 text-sky-700 hover:bg-sky-200 transition-all border border-sky-300 shadow-sm flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
      費率表
    </button>
  </div>
</div>

<!-- 心智圖容器 -->
<div class="flex-1 relative bg-slate-50">
  <svg id="mindmap" class="w-full h-full block"></svg>
</div>

<!-- RWD 螢幕中央隱藏式說明展示 (淡綠色背景) -->
<div id="mindmap-tooltip" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 hidden w-[92%] sm:w-[85%] md:w-[75%] max-w-[480px] bg-[#dcfce7] border-2 border-[#86efac] text-[#14532d] p-4 md:p-6 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.2)] z-[1000] transition-all duration-300 opacity-0 scale-95 break-words leading-relaxed"></div>

<!-- 投保規劃設定 Modal -->
<div id="config-modal" class="fixed inset-0 bg-slate-900/60 hidden z-[2000] flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-3xl max-h-[90vh] rounded-xl shadow-2xl flex flex-col overflow-hidden">
     <!-- Header -->
     <div class="p-4 border-b flex justify-between items-center bg-sky-50">
        <h2 class="text-xl font-bold text-sky-800 flex items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            專屬投保規劃設定
        </h2>
        <button onclick="closeConfigModal()" class="text-gray-400 hover:text-gray-700 hover:bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center text-2xl transition-colors">&times;</button>
     </div>
     
     <!-- Body (scrollable) -->
     <div class="p-5 overflow-y-auto flex-1 space-y-5 text-gray-800">
        <!-- 客戶名稱 -->
        <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border">
            <label class="font-bold text-gray-700 whitespace-nowrap">客戶名稱</label>
            <input type="text" id="cfg-customer-name" class="border border-gray-300 rounded px-3 py-1.5 flex-1 focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="請輸入客戶或公司名稱">
        </div>
        
        <div class="space-y-3">
            <!-- 商業火災保險 -->
            <div class="flex items-center gap-3 bg-white p-2 rounded hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="cfg-fire" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500 cursor-pointer" onchange="calcTotal()">
                <label for="cfg-fire" class="font-bold w-32 cursor-pointer">商業火災保險</label>
                <select id="cfg-fire-plan" class="border border-gray-300 rounded px-2 py-1 flex-1 focus:ring-2 focus:ring-sky-500 focus:outline-none cursor-pointer" onchange="calcTotal()">
                    <option value="方案一">方案一 (保額 100 萬)</option>
                    <option value="方案二">方案二 (保額 300 萬)</option>
                    <option value="方案三">方案三 (保額 500 萬)</option>
                    <option value="方案四">方案四 (保額 800 萬)</option>
                    <option value="方案五">方案五 (保額 1,000 萬)</option>
                </select>
                <div class="flex items-center gap-1">
                    <span class="text-gray-500">$</span>
                    <input type="number" id="cfg-fire-premium" class="border border-gray-300 rounded px-2 py-1 w-24 text-right focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="保費" oninput="calcTotal()" min="0">
                </div>
            </div>

            <!-- 停業損失 -->
            <div class="flex items-center gap-3 bg-white p-2 rounded hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="cfg-biz" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500 cursor-pointer" onchange="calcTotal()">
                <label for="cfg-biz" class="font-bold w-32 cursor-pointer">停業損失補償</label>
                <select id="cfg-biz-plan" class="border border-gray-300 rounded px-2 py-1 flex-1 focus:ring-2 focus:ring-sky-500 focus:outline-none cursor-pointer" onchange="calcTotal()">
                    <option value="1000元">日額 1,000 元</option>
                    <option value="2000元">日額 2,000 元</option>
                    <option value="3000元">日額 3,000 元</option>
                    <option value="5000元">日額 5,000 元</option>
                </select>
                <div class="flex items-center gap-1">
                    <span class="text-gray-500">$</span>
                    <input type="number" id="cfg-biz-premium" class="border border-gray-300 rounded px-2 py-1 w-24 text-right focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="保費" oninput="calcTotal()" min="0">
                </div>
            </div>

            <!-- 公共意外責任險區塊 -->
            <div class="border border-sky-100 bg-sky-50/30 rounded-lg p-3 space-y-2">
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="cfg-pub" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500 cursor-pointer" onchange="calcTotal()">
                    <label for="cfg-pub" class="font-bold w-32 text-sky-900 cursor-pointer">公共意外責任險</label>
                    <select id="cfg-pub-plan" class="border border-gray-300 rounded px-2 py-1 flex-1 focus:ring-2 focus:ring-sky-500 focus:outline-none cursor-pointer" onchange="calcTotal()">
                        <option value="方案一">方案一 (體傷 200萬/財損 200萬)</option>
                        <option value="方案二">方案二 (體傷 300萬/財損 300萬)</option>
                        <option value="方案三">方案三 (體傷 600萬/財損 300萬)</option>
                    </select>
                    <div class="flex items-center gap-1">
                        <span class="text-gray-500">$</span>
                        <input type="number" id="cfg-pub-premium" class="border border-gray-300 rounded px-2 py-1 w-24 text-right focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="保費" oninput="calcTotal()" min="0">
                    </div>
                </div>
                <!-- 附加條款 -->
                <div class="pl-10 mt-2 flex items-center justify-between">
                    <span class="text-sm font-bold text-sky-800">附加條款選項：</span>
                    <div class="flex items-center gap-1.5 bg-orange-50 px-2 py-1 rounded border border-orange-200 cursor-pointer hover:bg-orange-100 transition-colors" onclick="document.getElementById('cfg-pub-all').click()">
                        <input type="checkbox" id="cfg-pub-all" class="w-4 h-4 text-orange-600 rounded cursor-pointer focus:ring-orange-500" onclick="event.stopPropagation()" onchange="togglePubAll()">
                        <label for="cfg-pub-all" class="text-sm font-extrabold text-orange-700 cursor-pointer" onclick="event.stopPropagation(); document.getElementById('cfg-pub-all').click()">✅ 5項全選 (免繳保費)</label>
                    </div>
                </div>
                <div class="pl-10 grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
                    <div class="flex items-center gap-2 bg-white px-2 py-1.5 rounded border border-gray-100">
                        <input type="checkbox" id="cfg-pub-food" class="w-4 h-4 text-sky-600 rounded cursor-pointer" onchange="checkPubAllState(); calcTotal()">
                        <label for="cfg-pub-food" class="text-sm flex-1 cursor-pointer">食品中毒附加</label>
                        <input type="text" id="cfg-pub-food-premium" class="border border-gray-300 rounded px-1 py-0.5 w-[76px] text-right text-sm focus:ring-1 focus:ring-sky-500" placeholder="保費" oninput="calcTotal()">
                    </div>
                    <div class="flex items-center gap-2 bg-white px-2 py-1.5 rounded border border-gray-100">
                        <input type="checkbox" id="cfg-pub-sign" class="w-4 h-4 text-sky-600 rounded cursor-pointer" onchange="checkPubAllState(); calcTotal()">
                        <label for="cfg-pub-sign" class="text-sm flex-1 cursor-pointer">招牌責任附加</label>
                        <input type="text" id="cfg-pub-sign-premium" class="border border-gray-300 rounded px-1 py-0.5 w-[76px] text-right text-sm focus:ring-1 focus:ring-sky-500" placeholder="保費" oninput="calcTotal()">
                    </div>
                    <div class="flex items-center gap-2 bg-white px-2 py-1.5 rounded border border-gray-100">
                        <input type="checkbox" id="cfg-pub-park" class="w-4 h-4 text-sky-600 rounded cursor-pointer" onchange="checkPubAllState(); calcTotal()">
                        <label for="cfg-pub-park" class="text-sm flex-1 cursor-pointer">停車場責任附加</label>
                        <input type="text" id="cfg-pub-park-premium" class="border border-gray-300 rounded px-1 py-0.5 w-[76px] text-right text-sm focus:ring-1 focus:ring-sky-500" placeholder="保費" oninput="calcTotal()">
                    </div>
                    <div class="flex items-center gap-2 bg-white px-2 py-1.5 rounded border border-gray-100">
                        <input type="checkbox" id="cfg-pub-elev" class="w-4 h-4 text-sky-600 rounded cursor-pointer" onchange="checkPubAllState(); calcTotal()">
                        <label for="cfg-pub-elev" class="text-sm flex-1 cursor-pointer">電梯責任附加</label>
                        <input type="text" id="cfg-pub-elev-premium" class="border border-gray-300 rounded px-1 py-0.5 w-[76px] text-right text-sm focus:ring-1 focus:ring-sky-500" placeholder="保費" oninput="calcTotal()">
                    </div>
                    <div class="flex items-center gap-2 bg-white px-2 py-1.5 rounded border border-gray-100">
                        <input type="checkbox" id="cfg-pub-cond" class="w-4 h-4 text-sky-600 rounded cursor-pointer" onchange="checkPubAllState(); calcTotal()">
                        <label for="cfg-pub-cond" class="text-sm flex-1 cursor-pointer">慰問金費用附加</label>
                        <input type="text" id="cfg-pub-cond-premium" class="border border-gray-300 rounded px-1 py-0.5 w-[76px] text-right text-sm focus:ring-1 focus:ring-sky-500" placeholder="保費" oninput="calcTotal()">
                    </div>
                </div>
            </div>

            <!-- 現金保險 -->
            <div class="flex items-center gap-3 bg-white p-2 rounded hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="cfg-cash" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500 cursor-pointer" onchange="calcTotal()">
                <label for="cfg-cash" class="font-bold w-32 cursor-pointer">現金保險</label>
                <select id="cfg-cash-plan" class="border border-gray-300 rounded px-2 py-1 flex-1 focus:ring-2 focus:ring-sky-500 focus:outline-none cursor-pointer" onchange="calcTotal()">
                    <option value="方案a">方案a (保額 5 萬)</option>
                    <option value="方案b">方案b (保額 10 萬)</option>
                    <option value="方案c">方案c (保額 20 萬)</option>
                </select>
                <div class="flex items-center gap-1">
                    <span class="text-gray-500">$</span>
                    <input type="number" id="cfg-cash-premium" class="border border-gray-300 rounded px-2 py-1 w-24 text-right focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="保費" oninput="calcTotal()" min="0">
                </div>
            </div>

            <!-- 雇主意外 (包含人數費率計算) -->
            <div class="border border-sky-100 bg-sky-50/30 rounded-lg p-3 space-y-2">
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="cfg-emp" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500 cursor-pointer" onchange="calcTotal()">
                    <label for="cfg-emp" class="font-bold w-32 text-sky-900 cursor-pointer">雇主意外責任險</label>
                    <select id="cfg-emp-plan" class="border border-gray-300 rounded px-2 py-1 flex-1 focus:ring-2 focus:ring-sky-500 focus:outline-none cursor-pointer" onchange="calcTotal()">
                        <option value="方案一">方案一 (每人體傷 200 萬)</option>
                        <option value="方案二">方案二 (每人體傷 300 萬)</option>
                    </select>
                    <div class="flex items-center gap-1">
                        <span class="text-gray-500 font-bold">小計 $</span>
                        <input type="number" id="cfg-emp-premium" class="border border-gray-300 rounded px-2 py-1 w-24 text-right bg-gray-100 font-bold focus:outline-none cursor-not-allowed" placeholder="自動計算" readonly>
                    </div>
                </div>
                <!-- 費率與人數輸入 -->
                <div class="pl-10 flex flex-wrap items-center gap-4">
                    <div class="flex items-center gap-2 bg-white px-2 py-1.5 rounded border border-gray-100">
                        <label for="cfg-emp-rate" class="text-sm text-gray-600">每人費率</label>
                        <input type="number" id="cfg-emp-rate" class="border border-gray-300 rounded px-2 py-1 w-20 text-right focus:ring-2 focus:ring-sky-500 focus:outline-none text-sm" placeholder="$" oninput="calcEmpPremium()" min="0">
                    </div>
                    <div class="text-gray-400 font-bold text-sm">X</div>
                    <div class="flex items-center gap-2 bg-white px-2 py-1.5 rounded border border-gray-100">
                        <label for="cfg-emp-count" class="text-sm text-gray-600">人數</label>
                        <input type="number" id="cfg-emp-count" class="border border-gray-300 rounded px-2 py-1 w-20 text-right focus:ring-2 focus:ring-sky-500 focus:outline-none text-sm" placeholder="人" oninput="calcEmpPremium()" min="0">
                    </div>
                </div>
            </div>
        </div>
     </div>
     
     <!-- Footer -->
     <div class="p-4 border-t bg-gray-50 flex items-center justify-between">
         <div class="text-lg font-bold text-gray-800">
             合計保費：<span class="text-red-600 text-2xl" id="cfg-total-premium">$0</span>
         </div>
         <div class="flex gap-3">
             <button onclick="applyConfig()" class="bg-sky-600 text-white px-5 py-2.5 rounded-lg font-bold shadow-md hover:bg-sky-700 hover:shadow-lg transition-all active:scale-95">

  // 取得下拉選單文字的 Helper
  function getSelectedText(selectId) {
      const el = document.getElementById(selectId);
      return el.options[el.selectedIndex].text;
  }

  // 預處理資料：標示互動節點，並依照投保狀態加上標籤與樣式 (加入 currentContext 追蹤所屬險種)
  function applyConfigToNode(node, config, currentContext = null) {
      const cleanText = node.content.replace(/<[^>]*>?/gm, '').trim();
      const hasLink = node.content.includes('<a ');
      const matchedItem = tooltipContentDict.find(item => cleanText.includes(item.key));
      
      // 判斷目前節點屬於哪一個主險種的脈絡
      let nextContext = currentContext;
      if (matchedItem && configKeyMapping[matchedItem.key]) {
          nextContext = configKeyMapping[matchedItem.key];
      }

      let finalContent = node.content;
      let isInsured = null; // true, false, null

      // 確認該節點是否有對應的保險設定 (主節點)
      if (matchedItem) {
          const configKey = configKeyMapping[matchedItem.key];
          if (configKey && config.items[configKey]) {
              isInsured = config.items[configKey].checked;
          }
      }

      // 包覆 interactive-base (如果尚未包覆)
      if (hasLink || matchedItem) {
          if (!finalContent.includes('interactive-base')) {
              if (hasLink) {
                  finalContent = finalContent.replace(/(<a[^>]*>.*?<\/a>)/i, '<span class="interactive-base">$1</span>');
              } else if (finalContent.includes('<strong')) {
                  finalContent = finalContent.replace(/(<strong[^>]*>.*?<\/strong>)/i, '<span class="interactive-base">$1</span>');
              } else {
                  finalContent = `<span class="interactive-base">${finalContent}</span>`;
              }
          }
      }

      // 如果有套用設定且有對應的投保狀態，則加入狀態標籤與修改樣式
      if (config.applied && isInsured !== null) {
          if (isInsured) {
               finalContent += `<span class="ml-2 inline-block px-1.5 py-0.5 bg-green-100 text-green-700 text-xs font-bold rounded shadow-sm border border-green-200 align-middle">✅ 已投保</span>`;
          } else {
               finalContent += `<span class="ml-2 inline-block px-1.5 py-0.5 bg-gray-100 text-gray-500 text-xs font-bold rounded shadow-sm border border-gray-200 align-middle">❌ 未投保</span>`;
               finalContent = finalContent.replace('interactive-base', 'interactive-base-uninsured');
          }
      }

      // 處理子項目的「方案選擇」標註
      if (config.applied && nextContext && config.items[nextContext]) {
          const itemConfig = config.items[nextContext];
          const isPlanNode = /^方案\s*[一二三四五abc]/i.test(cleanText);
          
          if (isPlanNode) {
              const planMatch = cleanText.match(/^方案\s*([一二三四五abc])/i);
              const selectedPlanMatch = (itemConfig.planText || "").match(/^方案\s*([一二三四五abc])/i);
              
              if (planMatch) {
                  const planId = planMatch[1].toLowerCase();
                  const selectedPlanId = selectedPlanMatch ? selectedPlanMatch[1].toLowerCase() : null;

                  if (itemConfig.checked && planId === selectedPlanId) {
                      // 客戶選擇的方案
                      finalContent += `<span class="ml-2 inline-block px-1.5 py-0.5 bg-sky-100 text-sky-700 text-xs font-bold rounded shadow-sm border border-sky-200 align-middle">🎯 您的選擇</span>`;
                      // 藍字粗體凸顯
                      finalContent = `<span class="text-sky-700 font-bold">${finalContent}</span>`;
                  } else {
                      // 未選擇的方案或該主約未保 (加上刪除線與反灰)
                      finalContent = `<span class="text-gray-400 line-through opacity-70">${finalContent}</span>`;
                  }
              }
          }

          // 針對「停業損失補償附加條款」的金額選項特殊處理 (因為它沒有方案一二三，只有數字選項)
          if (nextContext === '停業損失補償附加條款' && cleanText.includes('每日補償定額可選')) {
              if (itemConfig.checked) {
                  const amountMatch = (itemConfig.planText || "").match(/(1,000|2,000|3,000|5,000)/);
                  if (amountMatch) {
                      const amount = amountMatch[1];
                      const regex = new RegExp(`(${amount}元)`, 'g');
                      // 替換該節點內的特定金額文字為高亮樣式
                      finalContent = finalContent.replace(regex, `<span class="text-sky-700 font-bold bg-sky-100 px-1 rounded border border-sky-200">$1 (🎯 您的選擇)</span>`);
                  }
              } else {
                  // 如果未投保，整行直接反灰加刪除線
                  finalContent = `<span class="text-gray-400 line-through opacity-70">${finalContent}</span>`;
              }
          }
      }

      node.content = finalContent;

      if (node.children && node.children.length > 0) {
          node.children.forEach(c => applyConfigToNode(c, config, nextContext));
      }
  }

  function renderMindmap() {
    // 深拷貝資料以防直接修改到原始數據
    const currentData = JSON.parse(JSON.stringify(sourceData));

    // 套用客戶投保規劃至節點
    applyConfigToNode(currentData, appState);

    // 遞迴控制各節點層級的折疊狀態
    function applyLevel(node, target, cur = 0) {
      if (!node.children || node.children.length === 0) return;
      node.payload = { fold: cur >= target ? 1 : 0 };
      node.children.forEach(c => applyLevel(c, target, cur + 1));
    }
    
    applyLevel(currentData, state.expandLevel);

    // 更新標題及保費顯示
    const titleEl = document.getElementById('main-title');
    const summaryBar = document.getElementById('summary-bar');
    const summaryPremium = document.getElementById('summary-premium');

    if (appState.applied) {
        if (appState.customerName) {
            titleEl.innerHTML = `南山產物「金頭家」專案投保指南 <span class="text-orange-600 ml-2">【${appState.customerName}】專屬規劃</span>`;
        } else {
            titleEl.innerHTML = `南山產物「金頭家」專案投保指南 <span class="text-orange-600 ml-2">【專屬規劃】</span>`;
        }
        summaryPremium.innerText = `$${appState.totalPremium.toLocaleString()}`;
        summaryBar.classList.remove('hidden');
        summaryBar.classList.add('flex');
    }

    if (!mm) {
      // 【修復重疊問題】清空 SVG 內部既有元素與舊工具列，避免匯出檔案重新載入時與舊有內容重疊
      document.getElementById('mindmap').innerHTML = '';
      const oldToolbar = document.getElementById('markmap-toolbar-container');
      if (oldToolbar) {
          oldToolbar.remove();
      }

      // 首次初始化
      mm = Markmap.create("#mindmap", { 
        duration: 500, 
        autoFit: true, 
        paddingX: 50 
      }, currentData);

      // 附加右下角工具列 (放大縮小功能)
      const toolbar = new Toolbar();
      toolbar.attach(mm);
      const toolbarEl = toolbar.render();
      toolbarEl.id = 'markmap-toolbar-container'; // 加上 ID 以便後續識別與清理
      toolbarEl.setAttribute("style", "position:absolute;bottom:20px;right:20px");
      document.querySelector('.relative').append(toolbarEl);
    } else {
      // 更新資料
      mm.setData(currentData);
      setTimeout(() => mm.fit(), 200);
    }
  }

  // 展開層級控制鈕點擊邏輯
  function setExpand(level) { 
    state.expandLevel = level; 
    [1, 2, 3, 4, 99].forEach(lv => { 
        const el = document.getElementById(lv === 99 ? 'exp-all' : `exp-${lv}`); 
        if(el) {
          if(lv === level) {
            el.className = 'px-4 py-1.5 text-sm font-bold rounded-lg bg-orange-600 text-white shadow transition-all';
          } else {
            el.className = 'px-4 py-1.5 text-sm font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all';
          }
        }
    }); 
    renderMindmap(); 
  }

  function calcEmpPremium() {
      const rate = Number(document.getElementById('cfg-emp-rate').value) || 0;
      const count = Number(document.getElementById('cfg-emp-count').value) || 0;
      const total = rate * count;
      
      // 如果有輸入任一數值則計算總價
      if (document.getElementById('cfg-emp-rate').value !== '' && document.getElementById('cfg-emp-count').value !== '') {
           document.getElementById('cfg-emp-premium').value = total;
      } else {
           document.getElementById('cfg-emp-premium').value = '';
      }
      calcTotal();
  }

  function calcTotal() {
      let total = 0;
      if (document.getElementById('cfg-fire').checked) total += Number(document.getElementById('cfg-fire-premium').value) || 0;
      if (document.getElementById('cfg-biz').checked) total += Number(document.getElementById('cfg-biz-premium').value) || 0;
      if (document.getElementById('cfg-pub').checked) total += Number(document.getElementById('cfg-pub-premium').value) || 0;
      if (document.getElementById('cfg-pub-food').checked) total += Number(document.getElementById('cfg-pub-food-premium').value) || 0;
      if (document.getElementById('cfg-pub-sign').checked) total += Number(document.getElementById('cfg-pub-sign-premium').value) || 0;
      if (document.getElementById('cfg-pub-park').checked) total += Number(document.getElementById('cfg-pub-park-premium').value) || 0;
      if (document.getElementById('cfg-pub-elev').checked) total += Number(document.getElementById('cfg-pub-elev-premium').value) || 0;

      if (document.getElementById('cfg-cash').checked) total += Number(document.getElementById('cfg-cash-premium').value) || 0;
      if (document.getElementById('cfg-emp').checked) total += Number(document.getElementById('cfg-emp-premium').value) || 0;
      
      document.getElementById('cfg-total-premium').innerText = "$" + total.toLocaleString();
  }

  function syncStateToModal() {
      if(!appState) return;
      document.getElementById('cfg-customer-name').value = appState.customerName || '';
      
      const setField = (key, chkId, planId, premId) => {
          if(appState.items[key]) {
              document.getElementById(chkId).checked = appState.items[key].checked;
              
              if (appState.items[key].premiumText !== undefined && appState.items[key].premiumText !== "") {
                  document.getElementById(premId).value = appState.items[key].premiumText;
              } else {
                  document.getElementById(premId).value = appState.items[key].premium || '';
              }
              
              if (planId) {
                  // 簡單的比對選擇
                  const select = document.getElementById(planId);
                  for (let i = 0; i < select.options.length; i++) {
                      if (select.options[i].text === appState.items[key].planText) {
                          select.selectedIndex = i;
                          break;
                      }
                  }
              }
          }
      };

      setField('商業火災保險', 'cfg-fire', 'cfg-fire-plan', 'cfg-fire-premium');
      setField('停業損失補償附加條款', 'cfg-biz', 'cfg-biz-plan', 'cfg-biz-premium');
      setField('公共意外責任保險', 'cfg-pub', 'cfg-pub-plan', 'cfg-pub-premium');
      setField('食品中毒責任附加條款', 'cfg-pub-food', null, 'cfg-pub-food-premium');
      setField('招牌責任', 'cfg-pub-sign', null, 'cfg-pub-sign-premium');
      setField('停車場責任', 'cfg-pub-park', null, 'cfg-pub-park-premium');
      setField('電梯責任', 'cfg-pub-elev', null, 'cfg-pub-elev-premium');
      setField('慰問金費用附加條款', 'cfg-pub-cond', null, 'cfg-pub-cond-premium');
      setField('現金保險', 'cfg-cash', 'cfg-cash-plan', 'cfg-cash-premium');
      setField('雇主意外責任保險', 'cfg-emp', 'cfg-emp-plan', 'cfg-emp-premium');

      // 額外設定雇主意外的人數與費率
      if(appState.items['雇主意外責任保險']) {
          document.getElementById('cfg-emp-rate').value = appState.items['雇主意外責任保險'].rate || '';
          document.getElementById('cfg-emp-count').value = appState.items['雇主意外責任保險'].count || '';
      }

      checkPubAllState();
      calcTotal();
  }

  function applyConfig() {
      syncModalToState();
      appState.applied = true;
      
      // 更新隱藏的 JSON 區塊
      document.getElementById('app-state-data').textContent = JSON.stringify(appState);
      
      closeConfigModal();
      renderMindmap();
  }

  // --- 關鍵優化區域：保證匯出檔案跟母版完全一致乾淨 ---
  function exportConfigHTML() {
      // 確保最新設定已套用至 appState
      syncModalToState();
      appState.applied = true;
      document.getElementById('app-state-data').textContent = JSON.stringify(appState);
      closeConfigModal();

      // 使用 cloneNode 複製整個 HTML 結構，如此一來不會影響使用者目前畫面
      const htmlClone = document.documentElement.cloneNode(true);

      // 在被複製出來的這份 HTML 裡，清除 D3/Markmap 動態生成的元素，
      // 確保新儲存的檔案不會夾帶上一次渲染的節點而導致版面錯亂，
      // 這保證了新檔案完全等於「原始乾淨的母版」+「最新的 JSON 設定」。
      const clonedMindmap = htmlClone.querySelector('#mindmap');
      if (clonedMindmap) {
          clonedMindmap.innerHTML = '';
      }
      const clonedToolbar = htmlClone.querySelector('#markmap-toolbar-container');
      if (clonedToolbar) {
          clonedToolbar.remove();
      }

      // 額外清理 Tooltip 可能殘留的拖曳位置與內聯樣式，保證新檔案的說明框能完美居中及維持拖曳功能
      const clonedTooltip = htmlClone.querySelector('#mindmap-tooltip');
      if (clonedTooltip) {
          clonedTooltip.removeAttribute('style');
          clonedTooltip.innerHTML = '';
          clonedTooltip.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 hidden w-[92%] sm:w-[85%] md:w-[75%] max-w-[480px] bg-[#dcfce7] border-2 border-[#86efac] text-[#14532d] p-4 md:p-6 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.2)] z-[1000] transition-all duration-300 opacity-0 scale-95 break-words leading-relaxed';
      }

      // 取得乾淨、完整的 HTML (包含費率表按鈕等所有的原始結構)
      let htmlContent = '<!DOCTYPE html>\n' + htmlClone.outerHTML;

      // 組合檔名並觸發下載
      const now = new Date();
      const twYear = now.getFullYear() - 1911;
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const dateStr = `${twYear}${month}${day}`;
      const cName = appState.customerName ? appState.customerName : '';
      const fileName = `${dateStr}${cName}金頭家投保說明.html`;

      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
  }

  // --- 畫面載入與事件綁定 ---
  window.onload = () => {
    // 檢查是否有儲存的設定檔 (例如從匯出的檔案開啟)
    const stateDataEl = document.getElementById('app-state-data');
    if (stateDataEl && stateDataEl.textContent.trim() !== '{}' && stateDataEl.textContent.trim() !== '') {
        try {
            appState = JSON.parse(stateDataEl.textContent);
            if (appState.applied) {
                syncStateToModal();
            }
        } catch (e) { 
            console.error("無法解析設定檔資料", e); 
        }
    }

    renderMindmap();

    // 設置隱藏式說明展示 (Tooltip) 的事件監聽
    const tooltipEl = document.getElementById('mindmap-tooltip');
    const svgEl = document.getElementById('mindmap');

    // 新增：Tooltip 延遲隱藏機制與拖曳變數
    let hideTooltipTimeout;
    let isDragging = false;
    let isDragged = false; // 新增：用於判斷是否為拖曳行為，避免拖曳放開時誤判為點擊
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let startX = 0;
    let startY = 0;

    svgEl.addEventListener('mouseover', (e) => {
      const node = e.target.closest('.markmap-node');
      if (node) {
        // 避免在同一個節點內部（如字體和節點圓圈）移動時重複觸發
        if (e.relatedTarget && node.contains(e.relatedTarget)) return;

        const textEl = node.querySelector('foreignObject') || node.querySelector('text');
        if (textEl) {
          const textContent = (textEl.textContent || textEl.innerText || "").trim();
          const hasLink = node.querySelector('a') !== null;
          const matchedItem = tooltipContentDict.find(item => textContent.includes(item.key));
          
          // 若為互動節點 (預處理時會符合這兩項條件之一)，則加入特定類別啟動 CSS 動畫
          if (matchedItem || hasLink) {
            node.classList.add('interactive-hover');
          }
          
          // 若有對應的隱藏式說明資料，才顯示說明面板
          if (matchedItem) {
            // 清除隱藏計時器並重置拖曳位置回中央
            clearTimeout(hideTooltipTimeout);
            if (!isDragging) {
                dragOffsetX = 0;
                dragOffsetY = 0;
                tooltipEl.style.transform = '';
            }

            // 解析出無標籤的乾淨標題 (以左括號或冒號截斷多餘說明)
            const cleanTitle = textContent.replace(/<[^>]*>?/gm, '').split('(')[0].split('：')[0].trim();
            let displayText = matchedItem.text;

            // 動態替換理賠說明
            if (appState.applied) {
                const configKey = configKeyMapping[matchedItem.key];
                if (configKey && appState.items[configKey]) {
                    const itemConfig = appState.items[configKey];
                    if (itemConfig.checked) {
                        // 已投保：替換投保假設
                        const myPlan = `【您的投保內容】${matchedItem.key}：${itemConfig.planText}`;
                        displayText = displayText.replace(/<span[^>]*>【投保假設】.*?<\/span><br>/i, `<span class="font-semibold text-sky-800 bg-sky-100 px-1 rounded">${myPlan}</span><br>`);
                    } else {
                        // 未投保：加上警告框，並讓原本的範例變淡
                        const uninsuredWarning = `<div class="bg-red-50 border-l-4 border-red-500 p-2.5 mb-3 text-red-700 font-bold text-sm rounded shadow-sm">⚠️ 您目前尚未規劃此保障，若發生此類事故將無法理賠。以下為一般範例參考：</div>`;
                        displayText = displayText.replace(/<div class="bg-white\/60/i, `${uninsuredWarning}<div class="bg-white/60 opacity-65`);
                    }
                }
            }
            
            tooltipEl.innerHTML = `
              <div id="tooltip-drag-handle" class="font-bold border-b border-[#86efac] pb-2 mb-2 text-[#166534] text-base md:text-lg cursor-move select-none flex items-center justify-between" title="按住此處可拖曳移動">
                <div class="flex items-center"><span class="mr-1">💡</span> ${cleanTitle}</div>
                <div class="text-[11px] font-normal bg-green-200/60 px-2 py-0.5 rounded-full text-[#14532d] border border-green-300 shadow-sm flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9a2 2 0 100-4 2 2 0 000 4zm4 6a2 2 0 100-4 2 2 0 000 4zm0 0l-4-4m4 4l4-4m-4 4v6"></path></svg>
                  可拖曳
                </div>
              </div>
              <div class="text-[13.5px] md:text-[15px] text-[#14532d] tracking-wide">
                ${displayText}
              </div>
            `;
            
            tooltipEl.style.display = 'block';
            
            // 強制重繪以觸發過渡動畫
            void tooltipEl.offsetWidth;
            tooltipEl.classList.remove('opacity-0', 'scale-95');
            tooltipEl.classList.add('opacity-100', 'scale-100');
          }
        }
      }
    });

    svgEl.addEventListener('mouseout', (e) => {
      const node = e.target.closest('.markmap-node');
      if (node) {
        if (e.relatedTarget && node.contains(e.relatedTarget)) return;

        // 滑開時移除放大與紅色效果
        node.classList.remove('interactive-hover');

        // 恢復說明框隱藏的狀態與動畫設定 (改用 setTimeout 延遲提供拖曳緩衝)
        hideTooltipTimeout = setTimeout(() => {
          tooltipEl.classList.remove('opacity-100', 'scale-100');
          tooltipEl.classList.add('opacity-0', 'scale-95');
          setTimeout(() => { 
            if (tooltipEl.classList.contains('opacity-0')) {
                tooltipEl.style.display = 'none'; 
            }
          }, 300);
        }, 300);
      }
    });

    // --- 新增：Tooltip 本身的滑鼠懸停與拖曳功能 ---
    tooltipEl.addEventListener('mouseenter', () => {
        clearTimeout(hideTooltipTimeout);
    });

    tooltipEl.addEventListener('mouseleave', () => {
        if (isDragging) return; // 拖曳中不隱藏
        hideTooltipTimeout = setTimeout(() => {
            tooltipEl.classList.remove('opacity-100', 'scale-100');
            tooltipEl.classList.add('opacity-0', 'scale-95');
            setTimeout(() => { 
                if (tooltipEl.classList.contains('opacity-0')) {
                    tooltipEl.style.display = 'none'; 
                }
            }, 300);
        }, 300);
    });

    tooltipEl.addEventListener('mousedown', (e) => {
        isDragged = false; // 每次按下滑鼠時先重置拖曳狀態
        if (e.target.closest('#tooltip-drag-handle')) {
            isDragging = true;
            tooltipEl.style.transition = 'none'; // 拖曳時取消動畫確保流暢
            startX = e.clientX - dragOffsetX;
            startY = e.clientY - dragOffsetY;
            e.preventDefault();
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        isDragged = true; // 確實有移動才標記為拖曳，避免單純點擊被誤判
        dragOffsetX = e.clientX - startX;
        dragOffsetY = e.clientY - startY;
        // 疊加原本的 -50% 置中效果與滑鼠偏移量
        tooltipEl.style.transform = `translate(calc(-50% + ${dragOffsetX}px), calc(-50% + ${dragOffsetY}px)) scale(1)`;
    });

    document.addEventListener('mouseup', (e) => {
        if (isDragging) {
            isDragging = false;
            tooltipEl.style.transition = ''; // 恢復 CSS 動畫
            
            // 檢查放開時滑鼠是否還在 Tooltip 範圍內，若無則啟動隱藏
            const rect = tooltipEl.getBoundingClientRect();
            const isHovering = (
                e.clientX >= rect.left && e.clientX <= rect.right &&
                e.clientY >= rect.top && e.clientY <= rect.bottom
            );
            
            if (!isHovering) {
                hideTooltipTimeout = setTimeout(() => {
                    tooltipEl.classList.remove('opacity-100', 'scale-100');
                    tooltipEl.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => { 
                        if (tooltipEl.classList.contains('opacity-0')) {
                            tooltipEl.style.display = 'none'; 
                        }
                    }, 300);
                }, 300);
            }
        }
    });

    // --- 新增：點擊 Tooltip 任意處即可關閉 ---
    tooltipEl.addEventListener('click', (e) => {
        // 如果剛才的操作是拖曳，就不觸發點擊關閉
        if (isDragged) return;
        
        clearTimeout(hideTooltipTimeout);
        tooltipEl.classList.remove('opacity-100', 'scale-100');
        tooltipEl.classList.add('opacity-0', 'scale-95');
        setTimeout(() => { 
            if (tooltipEl.classList.contains('opacity-0')) {
                tooltipEl.style.display = 'none'; 
            }
        }, 300);
    });

  };
</script>
